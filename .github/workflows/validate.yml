name: Validate migration agent
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - run: pip install -r requirements-dev.txt
      - run: RUN_DOCKER_TESTS=1 python -m pytest -q
      - name: Compile infrastructure without deploying
        run: az bicep build --file templates/infra/main.bicep --outfile /tmp/aks-foundry.json
