apiVersion: v1
kind: Pod
metadata:
  name: {{ .Values.appName }}-smoke
  labels:
    aks-migration-foundry.io/smoke: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: python:3.12-alpine
      command: [python, -c]
      args:
        - "import urllib.request; r=urllib.request.urlopen('http://{{ .Values.appName }}{{ .Values.healthPath }}', timeout=10); assert r.status == 200"
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
