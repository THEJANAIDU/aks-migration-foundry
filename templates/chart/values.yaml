  "image": {
    "repository": "ordersregistry.azurecr.io/orders",
    "digest": ""
  },
  "port": 8080,
  "healthPath": "/healthz",
  "replicas": 2,
  "environment": "staging",
  "workloadIdentityClientId": "",
  "ingressNamespace": "ingress-system",
  "egress": [],
